services:
  fenicsx:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: edss/fenicsx:dev
    container_name: fenicsx-edss
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - PYVISTA_OFF_SCREEN=true
   