services:
  fenicsx:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: edss/fenicsx:dev
    # Sem container_name: vários jobs podem rodar ao mesmo tempo.
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - PYVISTA_OFF_SCREEN=true
   