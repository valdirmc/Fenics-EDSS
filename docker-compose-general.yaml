# docker-compose-general.yaml — parte compartilhada (Nitro/Avell).
# Paths absolutos / GPU / overrides por máquina ficam em docker-compose.yaml (gitignored).
services:
  fenicsx:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: edss/fenicsx:dev
    container_name: fenicsx-edss
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      - ./output:/app/output
      # Nested Docker (FemEDSS-app via socket): descomente/ajuste no docker-compose.yaml local
      # - ${FENICS_HOST_DIR}:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYVISTA_OFF_SCREEN=true
    # Limites (ajuste no overlay local se necessário):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 8G
